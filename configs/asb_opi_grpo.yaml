# EvoGuard experiment: ASB-OPI (Agent Security Bench, observation prompt
# injection) with the native SFT -> GRPO defender path.
#
# Dataset: data/ASB (pruned upstream extract + the EvoGuard split). 51 distinct
# (agent, user_task) pairs across 10 agent personas, 400 injected attack
# instances. See data/ASB/README.md.
#
# THREE things differ from every agentdojo_* config here; read them before
# copying this file:
#
#  1. `env.suites` are AGENT names (system_admin_agent, ...), not suite files.
#     Leaving the list empty loads all ten.
#  2. `pipeline.val_split` is DELIBERATELY EMPTY. The shipped split's unit is the
#     attack instance, not the task: all 400 attacks sit on the 10
#     `user_task_index == 0` tasks, so those tasks appear in several splits.
#     Filtering env tasks by metadata["split"] == "val" would therefore throw
#     away most of the val attacks. Held-out-ness is enforced by
#     `val_dataset_dir` pointing at the leaf split dir instead, which restricts
#     the ATTACKS to that split while every task stays available as a carrier.
#     Consequence: ASB-OPI measures "unseen attacker tool / instruction on a seen
#     agent scenario". Do not report it as task-level generalisation.
#  3. `max_tasks: 0` means unbounded; a small positive value truncates in split
#     order (train first), which silently biases what gets trained on.
#
# `env.inject_harmful_tools` is ABSENT ON PURPOSE (it is v11's AgentDojo-only
# fix). ASB ships its own malicious-tool catalogue, and envs/asb.py publishes the
# TRAIN split's 256 attacker tools per agent into
# task.metadata["harmful_goal_candidates"], which harmful_catalog.sample_goal()
# prefers over its own inference. Without that seam sample_goal returns None on
# 46/51 tasks (two benign tools per agent, no decoy table) and the MCTS attacker
# reverts to goal=task.instruction, i.e. in-scope forgery counts as success.
# TRAIN split only: the three splits partition the 400 attacker tools disjointly
# (256/75/69, verified zero overlap), so drawing the attacker's own target from
# the full catalogue would put val/test tool names into training payloads and
# burn the held-out axis. Enforced by tests/test_asb_env.py
# (`test_attacker_objectives_never_leak_a_val_or_test_tool`).
#
# Confirm in the log:
#   [prewarm] loaded skeletons from .../data/seeds_v3 across 1 suites (total=32 entries)
#   [harmful_goal][task=asb_opi:...] kind=... tool=... in_benign_plan=False
# `exposes no sensitive sink` WARNINGs must be ZERO -- one means the metadata
# seam did not reach that task and its attacker fell back to the user goal.
#
# DELTAS vs the earlier (never-run) draft of this file
# ---------------------------------------------------
# Every one of these is a correction to a stale value, not a new hypothesis; the
# knob settings are lifted from configs/agentdojo_sinkdivert_v11.yaml so the two
# datasets stay comparable at the trainer level.
#   * training.base_model  ->
#     /root/paddlejob/workspace/yangxiao/models/Qwen2.5-7B-Instruct (every older
#     path in this file's history -- /root/yangxiao/..., /ssd1/yx/... -- belonged
#     to a previous box and does not exist here).
#   * judge_llm + utility_judge_llm  llama3-8b-judge @ :8002 -> qwen3.5-9b @ :8004,
#     max_tokens 256/512 -> 640/768. :8002 is a 16-day-old wedged server that
#     LISTENS but never answers (180 s timeouts, 0 MiB GPU), so this file could
#     not have produced a single verdict as written.
#     CAVEAT, measured 2026-09-06: through the asb_opi_v1 run :8004's
#     served-model-name was `qwen3.5-9b` but its `root` was
#     .../Qwen2.5-7B-Instruct and its log said
#     `Resolved architecture: Qwen2ForCausalLM` -- the name was right and the
#     weights were wrong, so the "9B scores 12/12 on the labelled verdict set vs
#     the 7B's 10/12" argument never actually held in a real run. Real weights
#     live at /root/paddlejob/workspace/yangxiao/models/Qwen3.5-9B. Verify the
#     `root` field of GET /v1/models, not just `id`.
#   * tool_executor_llm  -> qwen2.5-7b-it @ :8003 (the live executor endpoint).
#   * attacker.llm  local qwen2.5-7b-it @ :8000 -> qianfan glm-5.2. The defender
#     port is LoRA-hot-loaded every round, so an attacker sharing :8000 would be
#     mutating payloads with the model it is attacking.
#   * attacker gains the full EA/MCTS block (tournament_k ... mcts_lambda_delta).
#     Those fields defaulted silently before; mcts_lambda_delta=0.6 is what makes
#     `search_method: mcts_delta` Delta-guided at all.
#   * process.turning_point_method: llm_then_scan (was unset -> `scan`). scan stops
#     at the first EXTRA `tool|args` step, so one changed argument inside the
#     benign plan already counts as the turning point -- it under-reports exactly
#     the latent attacks the Delta curriculum is for. Delta from this run is not
#     comparable with any pre-v11 run.
#   * LoRA r16/a32/dropout 0.05 + 4 targets -> r32/a64/dropout 0.10 + 7 targets.
#   * sft_learning_rate 1.0e-4 -> 5.0e-5; grpo_learning_rate 5.0e-6 -> 2.0e-6;
#     grpo_rollout_temperature 1.15 -> 0.90.
#   * grpo_max_prompts_per_round + native_max_steps_per_round 200 -> 400. The old
#     comment reasoned per TASK, but the row budget is spent on STEPS: 33 train
#     tasks x (6 clean rollouts + up to 15 attacks) produce far more than 400
#     candidate steps, so 200 was leaving half the gradient on the floor. 400 also
#     matches v11, whose train split is 37 tasks.
#   * cuda_visible_devices -> "7" (the trainer card in the layout below; also
#     run_grpo_experiment.sh's own default, so TRAINER_CUDA_VISIBLE_DEVICES no
#     longer has to be exported).
#   * max_rounds 12 -> 15 -> 9, patience_rounds 5 -> 999 (early stopping OFF, val
#     eval stays on -- the val curve selects the best round). 9 rather than 15
#     because the useful signal is early: asb_opi_v1 peaked at r5 and
#     agentdojo_sinkdivert_v11 at r4/r7, while v11's r9 carried ~69% judge false
#     positives (11/16). Rounds past ~9 buy noise at ~2.5 h each.
#   * task_concurrency 8 -> 12, attack_concurrency 8 -> 16, val_concurrency 4 -> 8.
#     Do NOT raise attack_concurrency further: the attack phase is bounded by the
#     QianFan gateway's measured 60 rpm quota, which QianFanClient's process-wide
#     pacer holds at EVOGUARD_QIANFAN_MAX_RPM=55. 16 is already past it.
#   * defense.max_turns 8 -> 6. THE ONE dataset-specific change. An ASB agent
#     exposes exactly TWO benign tools, so a completed episode is 2-3 tool calls;
#     mct_searcher._inject_turn_ceiling == defense.max_turns pre-creates one L1
#     MCTS child per turn slot, and slots past the episode's real length can never
#     deliver a payload. At 8 the search wastes >=60% of its L1 budget on turns the
#     rollout never reaches.
#
# LAUNCH CONTRACT -- env vars this file cannot express
# ---------------------------------------------------
#   EVOGUARD_PY_BIN=/root/paddlejob/workspace/yangxiao/miniconda3/envs/evoguard/bin/python
#       Ubuntu 24.04.3 / glibc 2.39 / 8x H800 80GB. ONE conda env both trains and
#       serves: vllm 0.19.1 + torch 2.10.0+cu128 + transformers 4.57.6 +
#       trl 0.19.0 + peft 0.19.0. It registers
#       Qwen3_5ForConditionalGeneration, so Qwen3.5-9B serves natively -- the old
#       "CentOS 7 / glibc 2.17, Qwen3.5 only via Docker" constraint belonged to
#       the previous box and no longer applies. Do not bump past vllm 0.19.1
#       (0.20+ needs driver >= 580) and do not bump trl (1.x is a code migration).
#   EVOGUARD_PREWARM_SEEDS_DIR=data/seeds_v3
#       Read as a FIXED directory by mct_searcher._load_prewarm_skeletons_all(),
#       not off env.data_root. universal_seeds.json parses to suite key
#       "universal", which REPLACES the cache and so applies to all ten ASB
#       agents. Its {{TARGET_TOOL}} placeholder is bound per task by
#       harmful_catalog.resolve_placeholders() -- on ASB that resolves to a train
#       split attacker tool. `total=0 entries` means the run degraded to NOSEED.
#   EVOGUARD_JUDGE_LLM_BASE_URL=http://127.0.0.1:8004/v1
#   EVOGUARD_PROGRESS_LLM_BASE_URL=http://127.0.0.1:8006/v1
#   EVOGUARD_JUDGE_LLM_MODEL=qwen3.5-9b
#       MANDATORY. The reward-path judges are OPT-IN and resolve their model name
#       from this ONE var (native_grpo_runner._judge_model_name(), used by both the
#       safety and the progress builder); it defaults to `qwen2.5-7b-it`, which
#       :8004 does not host, so leaving it unset 404s every reward-path judge call.
#       An unset BASE_URL is worse than wrong: a constant `unclear` fallback
#       DELETES the safety gradient under group-relative advantages, invisibly in
#       loss / reward-mean / grad-norm. Confirm `progress judge active` in the log
#       and watch `safety_source_tally` in the plan JSON.
#       Splitting PROGRESS onto :8006 is the ONLY way the second judge card sees
#       traffic: each builder holds ONE client on ONE base_url and
#       EVOGUARD_REWARD_JUDGE_WORKERS just fans threads out across it, so a
#       replica behind the same URL is dead weight. This split is exactly what the
#       separate env var exists for. Both roles must be the same model, since they
#       share EVOGUARD_JUDGE_LLM_MODEL.
#   EVOGUARD_REWARD_JUDGE_WORKERS=32
#       Reward-path judge fan-out (clamped to 64 in native_grpo_runner). The old
#       16 was sized for a judge endpoint SHARED with other roles; here safety owns
#       :8004 (GPU 6) and progress owns :8006 (GPU 5). Not the bottleneck either
#       way: G=8 completions x 2 judges x ~0.4 s, fully parallel, is ~1 s against
#       the ~13 s/prompt that GENERATION costs -- see grpo_use_vllm_colocate.
#   EVOGUARD_TRAINER_MIN_FREE_MIB=40960
#       Read AT IMPORT TIME by training/native_runner.py, so it must be exported
#       before python starts. Only r0 SFT consults it (_wait_for_free_gpu_memory
#       is never called on the GRPO path); at the stale 73728 it burned ~30 min
#       reserving memory in 1 GiB blocks. A 7B LoRA SFT does not need 72 GB.
#
# GPU layout for this run  (8x H800 80GB)
# ---------------------------------------
#   GPU 0 -> primary defender vLLM :8000, --enable-lora  qwen2.5-7b-it
#            (needs VLLM_ALLOW_RUNTIME_LORA_UPDATING=1 at LAUNCH time)
#   GPU 1 -> qwen2.5-7b-it -> :8003, the tool_executor
#   GPU 6 -> qwen3.5-9b -> :8004, trajectory judge + utility_judge + reward-path
#            SAFETY judge
#            (--gdn-prefill-backend triton is MANDATORY; flashinfer's sm90a
#             gated-delta-rule prefill aborts AFTER /v1/models reports healthy)
#   GPU 5 -> qwen3.5-9b -> :8006, reward-path PROGRESS judge (see the
#            EVOGUARD_PROGRESS_LLM_BASE_URL note: this split, not a replica behind
#            one URL, is what puts the second card to work)
#   GPU 7 -> native SFT/GRPO trainer (single card; native_runner has no DDP, and
#            multi-process DDP would split a G=8 sibling group across ranks and
#            silently break GDPO / trajectory pooling / Delta shaping, all of
#            which index LOCAL advantage tensors)
#   GPU 2/3/4 -> spare / oversubscription filler. Nothing may sit on GPU 7 if
#            grpo_use_vllm_colocate is on: vLLM profiles WHOLE-CARD free memory.
#   Do NOT run scripts/stop_vllm.sh to clean a helper port: that script always
#   stops the primary too, even when given only helper ports. Kill the pid in
#   rounds/vllm_helper_<port>.pid instead.

name: evoguard_asb_opi_v1

defense:
  llm:
    backend: openai
    model: qwen2.5-7b-it
    base_url: http://127.0.0.1:8000/v1
    api_key: EMPTY
    temperature: 0.2
    max_tokens: 1024
    timeout: 120.0
    max_retries: 3
  # 6, not agentdojo's 8: an ASB agent has TWO benign tools, and
  # mct_searcher._inject_turn_ceiling == this value decides how many L1 MCTS
  # children (one per candidate injection turn) get pre-created.
  max_turns: 6

attacker:
  llm:
    backend: qianfan
    model: glm-5.2                      # creds verified live for glm-5.2 and glm-5;
                                        # 5.2 is the string every successful
                                        # historical run used.
    base_url: null
    api_key: null                       # credentials come from
                                        # ${EVOGUARD_SECRETS_FILE:-$HOME/.evoguard_qianfan.env}
                                        # via EVOGUARD_QIANFAN_APPID / _TOKEN.
    temperature: 1.0
    top_p: 0.95
    max_tokens: 4096
    timeout: 300
    # Backstop only. The real defence against the gateway's measured 60 rpm quota
    # is the process-wide send pacer in QianFanClient
    # (EVOGUARD_QIANFAN_MAX_RPM=55, exported by run_grpo_experiment.sh). An
    # exhausted attacker call makes rollout.py drop the whole task from the round,
    # silently shrinking the training set.
    max_retries: 8
    lora_adapter: null
    enable_thinking: false

  population_size: 15
  offspring_size: 10
  elite_size: 3
  tournament_k: 3
  crossover_rate: 0.9
  mutation_rate: 0.5
  diversity_penalty: 0.4
  diversity_position_window: 1
  crowding_factor: 2
  immigrant_injection_rate: 0.20
  fitness_drop_threshold: 0.50
  random_seed: 42

  search_method: mcts_delta
  mcts_ucb_c: 1.414
  mcts_lambda_delta: 0.6               # Delta-guided UCB. 0.0 turns mcts_delta into
                                       # plain MCTS without saying so.

env:
  dataset: asb_opi
  data_root: data
  # Agent personas, not suite files. Empty = all ten.
  suites: []
  max_tasks: 0
  tool_executor_llm:
    backend: openai
    model: qwen2.5-7b-it
    base_url: http://127.0.0.1:8003/v1   # :8003, NOT :8002 -- see the header.
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false
  # Judges on Qwen3.5-9B, served natively by the conda env on :8004 (GPU 5).
  # max_tokens 640/768 because the verdict is grammar-constrained JSON: hitting
  # the cap yields an UNPARSEABLE truncated object, not a short one. Verify the
  # `root` field of GET :8004/v1/models really points at .../Qwen3.5-9B -- a
  # `served-model-name` alone proves nothing (see the header caveat).
  judge_llm:
    backend: openai
    model: qwen3.5-9b
    base_url: http://127.0.0.1:8004/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 640
    enable_thinking: false
  utility_judge_llm:
    backend: openai
    model: qwen3.5-9b
    base_url: http://127.0.0.1:8004/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 768
    enable_thinking: false

process:
  divergence_threshold: 0.5
  normalize_by: clean_length
  # `llm_then_scan`, not `llm`: an unattributable verdict (turning_turn=-1) would
  # otherwise yield turning_point=None -> delta=None -> delta_normalized=0.0,
  # silently dropping that success out of the advantage-shaping curriculum.
  # signals.metadata records `turning_point_scan` / `turning_point_judged` /
  # `turning_point_source`, so the agreement rate is recoverable post-hoc.
  turning_point_method: llm_then_scan

training:
  enabled: true
  base_model: /root/paddlejob/workspace/yangxiao/models/Qwen2.5-7B-Instruct

  method: sft_then_native_grpo        # r0 -> cold-start LoRA-SFT; >=r1 -> incremental
                                      # native GRPO (needs <exp>/latest_adapter_dir.txt;
                                      # hard-errors rather than silently falling back).

  lora_rank: 32                       # <= start_vllm.sh's --max-lora-rank 64, so the
                                      # per-round hot-load is accepted.
  lora_alpha: 64
  lora_dropout: 0.10
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

  llamafactory_root: ""
  verl_root: ""

  # ---- Cold-start SFT (r0 only) -------------------------------------- #
  sft_epochs: 2.0
  sft_learning_rate: 5.0e-5
  # Per-task PER-CLASS cap (clean / attack_fail / attack_success), records ranked
  # by utility inside each class before the cut. Must stay >=
  # pipeline.clean_rollouts_per_task or the extra clean samples are bought and
  # then thrown away.
  sft_max_records_per_task: 6

  # ---- Native GRPO --------------------------------------------------- #
  grpo_learning_rate: 2.0e-6
  grpo_beta: 0.01                     # loose KL leash -- lets the LoRA leave the SFT
                                      # warm start. Corollary: per-task forgetting is
                                      # real, so evaluate the BEST round, not the last.
  grpo_group_size_g: 8
  grpo_clip_epsilon: 0.20
  grpo_rollout_temperature: 0.90
  grpo_max_prompts_per_round: 400     # ROW budget over STEPS, not tasks. At K=1 rows
                                      # == trajectories == optimizer steps, so it is
                                      # paired with native_max_steps_per_round below.
  grpo_min_new_successes: 3           # skip the incremental retrain below this many
                                      # fresh B trajectories.

  # ---- Advantage normalisation --------------------------------------- #
  grpo_gdpo: true                     # per-term group standardisation, then batch
                                      # rescale. A NORMALISATION change: the reward is
                                      # still exactly R = r_safety + r_progress - p_drift.
  grpo_traj_group_size: 1             # K=1: the trajectory-pooled baseline fallback is a
                                      # bit-for-bit no-op.

  # Delta's ONLY path into training: A~ = (1 + lambda*delta_p)*A. lambda=0.0 silently
  # discards Delta altogether. Never re-add an inline Delta reward term.
  grpo_advantage_curriculum_lambda: 1.5
  grpo_clean_prompt_ratio: 0.25       # 100 BENIGN rows of 400. Their signal is entirely
                                      # the judged r_progress term; without them every
                                      # prompt pays for blocking, all G siblings converge
                                      # on blocking, reward std collapses and nothing
                                      # separates "blocked and still served the user"
                                      # from "blocked and gave up".

  # ---- Trainer infrastructure ---------------------------------------- #
  # Keep bs=1/accum=8 even on 80GB cards. TRL's GRPO counts
  # per_device_train_batch_size in *completions*, and the per-forward logits tensor
  # is bs x (2048 prompt + 512 completion) x 152064 vocab x 2 B held live several
  # times over (policy / ref / old logprobs) on top of LoRA backward activations.
  per_device_batch_size: 1
  gradient_accumulation: 8

  dry_run: false
  use_native_trainer: true
  cuda_visible_devices: "7"           # dedicated trainer card; native_runner has no
                                      # DDP/sharding so exactly one device may be listed.
  native_max_steps_per_round: 400     # BINDING cap on prompt coverage at K=1.

  # ---- GRPO generation backend --------------------------------------- #
  # false = HF `generate` inside the trainer process (bs=1, serialized with the
  # blocking judge HTTP): measured 13.37 s/prompt at G=4 on this box, and
  # production runs G=8. true = TRL's colocate mode, an in-process vllm.LLM on
  # the SAME card as the trainer, weights resynced every optimizer step via
  # _move_model_to_vllm (GRPO needs on-policy samples, so pointing generation at
  # the long-lived :8000 server is not an option -- its adapter would be stale
  # after step 1). vllm_mode="server" is unusable here: `import
  # trl.scripts.vllm_serve` dies with ImportError on GuidedDecodingParams under
  # vllm 0.19.1.
  #
  # Colocate needs TWO shims, installed by _trl_compat.patch_trl_probes(
  # enable_vllm=True): vllm 0.19 renamed GuidedDecodingParams ->
  # StructuredOutputsParams (TRL imports the old name at module scope) and dropped
  # SamplingParams' `guided_decoding` kwarg, which TRL's colocate branch passes
  # unconditionally. That shim is a ONE-SHOT, PROCESS-WIDE decision, so
  # native_runner (r0 SFT) reads this same flag -- otherwise r0 would latch the
  # backend off for every later round in a `sft_then_native_grpo` run.
  #
  # Advantage maths is untouched either way: _DeltaShapedGRPOTrainer overrides
  # only _generate_and_score_completions' return dict.

  # A/B'd 2026-09-07 by replaying rounds/box_validation/round_1/records.jsonl
  # (8 prompt rows, G=4, same warm-start adapter, EVOGUARD_GRPO_SEED pinned)
  # through train_native_grpo once per arm:
  #
  #   arm   s/prompt  generate+logprobs  judge  backward  mean_reward_after
  #   off    12.31       82.4 s          6.6 s   9.5 s      0.350
  #   on      3.20       13.9 s          6.1 s   5.5 s      0.902
  #   on'     3.06       13.5 s          5.8 s   5.2 s      1.330   (2nd seed)
  #
  # 3.9x end-to-end, 6x on generation alone; judge+reward is untouched, as
  # expected. The reward gap between arms (0.55) is SMALLER than the gap between
  # two seeds of the SAME arm (0.43 -> same order), 4 of 8 steps were bit-identical
  # across arms, and reward_std/frac_reward_zero_std/safety_source_tally all match
  # -- so this is sampler variance on 8 groups, not a maths change. Pinning the
  # seed cannot make the arms identical: vLLM and HF `generate` do not share a
  # sampler. What WOULD indicate a broken weight resync is a flat or stale reward
  # trace; instead every step logs `Successfully reset prefix cache`, the tail of
  # _move_model_to_vllm.
  grpo_use_vllm_colocate: true
  # Whole-card fraction the colocated engine reserves, and it profiles free VRAM
  # at construction, so NOTHING else may sit on the trainer card. Budget on the
  # 80 GB H800: policy 14 + reference 14 (grpo_beta=0.01>0 loads a ref) + engine
  # ~20 + activations ~15 ~= 63 GB. On OOM lower this to 0.18 before reaching for
  # gradient_checkpointing. Must be an unquoted float -- _dataclass_from_dict
  # does no type coercion, so "0.25" would arrive as a str.
  grpo_vllm_gpu_memory_utilization: 0.25

  lora_probe_enabled: false

pipeline:
  # 9, not 15. The useful signal is early -- asb_opi_v1 peaked at r5,
  # agentdojo_sinkdivert_v11 at r4/r7, and v11's r9 carried ~69% judge false
  # positives (11/16). At ~2.5 h/round the tail bought noise. This is the single
  # largest wall-clock saving in the config and it costs nothing measurable.
  max_rounds: 9
  # EARLY STOPPING DISABLED: run all rounds unconditionally. Both exits are
  # neutralised, not the validation itself --
  #   stop_on_zero_success: false  kills the "no B trajectories" exit;
  #   patience_rounds > max_rounds  makes the streak unreachable
  #                                 (update_termination_state only stops when
  #                                  new_streak >= patience_rounds).
  patience_rounds: 999
  asr_threshold: 0.05                 # inert while patience_rounds > max_rounds;
                                      # kept so val_metrics.jsonl rows stay readable
                                      # against earlier runs.
  stop_on_zero_success: false
  # Inert: the env declares metadata["split"] from each task's clean row
  # (33 train / 11 val / 7 test) and driver._split_train_val honours it.
  validation_fraction: 0.15
  task_concurrency: 12
  attack_concurrency: 16
  # All 6 samples are persisted as CLEAN records; the TWIN is the highest-utility
  # one with `None` sorting as 1.0, and the three sites that pick one
  # (collect_tri_rollouts, build_sft, extract_grpo_prompts) agree on that rule.
  clean_rollouts_per_task: 6
  # Per-round held-out validation via eval/vendored_replay.py -- the only harness
  # in the repo that actually EXECUTES tools, so its ASR means what the
  # termination check assumes. Verify a "[val] rN adapter=... asr=..." line per
  # round; failures are swallowed and degrade to training ASR.
  validate_every_round: true
  # Leaf split dir -> restricts the REPLAYED ATTACKS to val's 75. See header note 2.
  val_dataset_dir: data/ASB/splits/val
  val_split: ""
  val_concurrency: 8

evo_data_subdir: "asb_opi"
