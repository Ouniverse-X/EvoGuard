# Eval-only replay of the complete AgentDojo Llama-3.1 GDPO arm on Delta-Bench.
# The adapter is trained with the full r0 SFT -> r1-r8 native GRPO pipeline and
# grpo_gdpo=true. Keep max_turns=18 and an empty split; Delta-Bench is ragged,
# so report the four-tier curve only on agentdojo:core (19 groups).
#
# The tier changes declared delta and pretext elaboration together. A rising
# curve is therefore a concealment/pretext result, not a pure-delta result.
# BU/UA are one 54-task figure pooled over all strata and cannot be split by tier.
#
# Replay example:
# EVOGUARD_REPLAY_CONFIG=configs/delta_bench_llama31_gdpo.yaml \
# EVOGUARD_REPLAY_DATASET_DIR=data/delta_bench EVOGUARD_REPLAY_SPLIT= \
#   bash scripts/run_replay_heldout.sh gdpo_on_r7 deltabench_llama31_gdpo_r7 4

name: evoguard_delta_bench_llama31_gdpo

defense:
  llm:
    backend: openai
    model: llama3.1-8b-it
    base_url: http://127.0.0.1:8010/v1
    api_key: EMPTY
    temperature: 0.2
    max_tokens: 1024
    timeout: 180.0
    max_retries: 3
    enable_thinking: false
  max_turns: 18

attacker:
  llm:
    backend: openai
    model: /root/paddlejob/workspace/yangxiao/models/Qwen2.5-7B-Instruct
    base_url: http://127.0.0.1:8011/v1
    api_key: EMPTY
    temperature: 1.05
    top_p: 0.95
    max_tokens: 2048
    timeout: 180.0
    max_retries: 3
    lora_adapter: null
    enable_thinking: false
  search_method: mcts_delta
  population_size: 15
  offspring_size: 10
  elite_size: 3
  random_seed: 42

env:
  dataset: delta_bench
  data_root: data
  suites: []
  max_tasks: 0
  tool_executor_llm:
    backend: openai
    model: /root/paddlejob/workspace/yangxiao/models/Qwen2.5-7B-Instruct
    base_url: http://127.0.0.1:8011/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false
  judge_llm:
    backend: openai
    model: qwen3.5-9b
    base_url: http://127.0.0.1:8004/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 256
    enable_thinking: false
  utility_judge_llm:
    backend: openai
    model: qwen3.5-9b
    base_url: http://127.0.0.1:8004/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false

process:
  divergence_threshold: 0.5
  normalize_by: clean_length
  turning_point_method: llm_then_scan

training:
  enabled: false
  base_model: /root/paddlejob/workspace/yangxiao/models/Meta-Llama-3.1-8B-Instruct
  method: native_sft
  dry_run: true

pipeline:
  max_rounds: 1
  validation_fraction: 0.0
  task_concurrency: 4
  attack_concurrency: 4
  validate_every_round: false
  val_split: ""

evo_data_subdir: "delta_bench"
