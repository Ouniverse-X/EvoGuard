# EvoGuard experiment v6: FULL local run with SIMPLIFIED seeds-v0.3 + MCTS attacker +
# native-GRPO defender RL. Bumps max_rounds from parent's 12 -> 20 per user instruction.
#
# Lineage vs prior experiments:
#   * Same sft_then_native_grpo recipe as configs/agentdojo_full_mcts.yaml (=v5).
#   * Seeds consumed at runtime come from data/toolsafe/agentdojo-tragj/*_seeds.json
#     currently at version 0.3 (22 total templates; aggressively trimmed down from
#     v0.2's 66-entry over-specific set blamed for continuation-run regression).
#   * max_rounds bumped 12->20 giving defender more headroom past observed r9-r11
#     plateau where train-side ASR stalled around ~0.15 instead of converging below ε=0.05.
#
# All other hyperparameters kept byte-identical to v5 baseline so apples-to-apples
# comparison isolates seed-design effect specifically.

name: evoguard_agentdojo_full_v6_mcts

defense:
  llm:
    backend: openai
    model: qwen2.5-7b-it                        # base served model; LoRA adapter overlaid each round after hot-load fix.
    base_url: http://127.0.0.1:8000/v1
    api_key: EMPTY                              # vLLM ignores key value but SDK requires non-empty string.
    temperature: 0.0                            # deterministic defense policy during rollouts — eliminates pre-injection divergence (negative delta) even without clean-replay; clean-replay is belt-and-suspenders.
    max_tokens: 1024                            # defense agent needs room for tool args + final answer JSON blob.
    timeout: 120.0
    max_retries: 3
    lora_adapter: null                          # base defense policy until first round writes its own adapter and registers onto vLLM.
  max_turns: 8                                  # cap applies uniformly across all suites for cost-bounded rollouts.

attacker:
  llm:
    backend: qianfan                            # 远程GLM API per user instruction; creds走EVOGUARD_QIANFAN_APPID/TOKEN env vars(sh/qianfan_run.sh内置默认字面量兜底)
    model: glm-5.2                              # 与v3/v4成功run一致(attacker用5.2;judge本exp仍用本地llama3不变)
    base_url: null                              # QianFanClient直连qianfan.baidubce.com不走openai base_url路径
    api_key: null                               # 不内嵌pipe-separated literal保持yaml干净可commit安全
    temperature: 0.95                           # 前次成功值(原local vllm=1.1随机性偏大)
    top_p: 0.95                                 # 同前次成功值
    max_tokens: 4096                            # 从8192降到4096匹配前次成功(GLM输出长度够用省配额)
    timeout: 300                                # 从180升到300给远程API更长容错窗口
    max_retries: 3
    lora_adapter: null                          # remote endpoint不支持LoRA hot-load概念留空即可
    enable_thinking: false                      # 关闭隐藏CoT预算确保JSON完整可见不被thinking截断

  population_size: 15                           # MCTS: batch size per round (N traversals of the shared tree).
  offspring_size: 10                            # GA-only; ignored by MCTS.
  elite_size: 3                                 # GA-only; ignored by MCTS.
  tournament_k: 3                               # GA-only; ignored by MCTS.
  crossover_rate: 0.9                           # GA-only; ignored by MCTS.
  mutation_rate: 0.5                            # GA-only; ignored by MCTS.
  diversity_penalty: 0.4                        # GA-only; ignored by MCTS.
  diversity_position_window: 1                 # GA-only; ignored by MCTS.
  crowding_factor: 2                            # GA-only; ignored by MCTS.
  immigrant_injection_rate: 0.20                # GA-only; ignored by MCTS.
  fitness_drop_threshold: 0.50                  # GA-only; ignored by MCTS.
  random_seed: 42

  search_method: mcts_delta                     # THE delta vs v4_grpo_v2: MCTS backend instead of GA.
  mcts_ucb_c: 1.414                             # classic UCB1 exploration coefficient (= sqrt(2)).
  mcts_lambda_delta: 0.6                        # weight of the delta-potential term in UCB-Δ selection score.

env:
  dataset: agentdojo
  data_root: data
  suites:                                       # full coverage identical to parent — required so attacker can re-inject against any task family during collection phase.
    - banking                                   # dedup'd unique instructions: ~5-6 per suite
    - slack                                     # workspace dominates total volume (~36 unique)
    - travel                                    # combined target sample budget ~=54 distinct prompts after loader-side instruction-deduplication pass.
    - workspace
  max_tasks: 100                                # generous upper bound above expected unique-task total (~54).
  tool_executor_llm:
    backend: openai
    model: llama3-8b-judge          # TEMPORARY FALLBACK served-name registered on live vllm instance listening at :8002 today.
    base_url: http://127.0.0.1:8002/v1
    api_key: EMPTY
    temperature: 0.0                             # deterministic simulated tool outputs preferred for reproducibility across reruns.
    max_tokens: 512
    enable_thinking: false
  judge_llm:
    backend: openai
    model: llama3-8b-judge
    base_url: http://127.0.0.1:8002/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 256
    enable_thinking: false
  utility_judge_llm:
    backend: openai
    model: llama3-8b-judge
    base_url: http://127.0.0.1:8002/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false

process:
  divergence_threshold: 0.5
  normalize_by: clean_length

training:
  enabled: true
  base_model: /ssd1/models/qwen2.5-7b-it        # local path beats HF repo-id avoiding network fetches mid-run.

  method: sft_then_native_grpo                  # r0 cold-start SFT; >=r1 incremental native GRPO (same as parent).

  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  llamafactory_root: ""
  verl_root: ""

  sft_epochs: 2.0
  sft_learning_rate: 1.0e-4

  grpo_learning_rate: 5.0e-6
  grpo_beta: 0.01
  grpo_group_size_g: 8
  grpo_clip_epsilon: 0.20
  grpo_rollout_temperature: 0.90
  grpo_max_prompts_per_round: 32
  grpo_min_new_successes: 3

  per_device_batch_size: 1
  gradient_accumulation: 8                       # eff_batch=8 stabilises updates.

  dry_run: false                                # genuine weight updates every viable round.
  use_native_trainer: true                       # bypass vendored llamafactory-cli / verl CLIs.
  cuda_visible_devices: "2"                      # GPU#2 confirmed idle pre-launch; isolated card for fit().
  native_max_steps_per_round: 200                # triple optimizer steps/round (same as parent).

pipeline:
  max_rounds: 20                                 # BUMPED FROM 12 PER USER REQUEST — give more room past r9-r11 plateau seen in v5.
  patience_rounds: 5                             # K=5 consecutive strict-asr<threshold rounds triggers termination.
  asr_threshold: 0.05                            # epsilon plan.md default.
  stop_on_zero_success: false                    # keep iterating toward convergence even if ASR hits floor mid-run.
  validation_fraction: 0.15
  task_concurrency: 8
  attack_concurrency: 8

evo_data_subdir: "agentdojo"
