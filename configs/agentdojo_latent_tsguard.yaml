# Baseline arm: TS-Guard (ToolSafe) step-level guardrail in front of the base
# defender, on AgentDojo-Latent, the camouflaged treatment.
#
# EVAL-ONLY. Read configs/agentdojo_latent_probe.yaml for the probe's design and
# Δ caveat, and data/agentdojo_latent/README.md, before quoting a number.
# Everything below that is not the arm itself is copied from
# configs/agentdojo_stock_shieldagent.yaml unchanged, because the arms are only
# comparable if nothing else moves.
#
# `defense.agent: tsguard_guard` keeps the SAME defender as the base arm (`llm`
# on :8000) and validates every PROPOSED tool call with MurrayTom/TS-Guard, as
# ToolSafe deploys it (src/agent/sec_react_agent.py:73-88): risk rating >= 0.5
# means the tool is not executed, the verdict comes back as an observation, and
# the agent re-proposes. So this measures a guarded SYSTEM's ASR, not the
# guardrail's detection accuracy.
#
# Read ASR here ONLY next to the over-blocking numbers, on BOTH datasets and on
# the clean arm: a guard that blocks everything scores ASR 0 with BU 0.
#   * cln.benign_utility / cln.false_alarm_rate -- what over-blocking costs
#   * atk.utility_under_attack                  -- resisted AND still delivered
#   * blocked_unfinished_rate                   -- where exhausted re-proposals land
# And check the guard-verdict tally (aggregated off `metadata.guard_verdict` by
# scripts/summarize_latent_vs_stock.py): the guard FAILS OPEN on an unreadable
# reply or a dead endpoint -- exactly as ToolSafe's own caller does -- so a run
# whose :8009 was down is indistinguishable from the undefended base arm by ASR
# alone. A tally dominated by `error:` or `unreadable:` guarded nothing.
#
# How to run it (defender :8000, TS-Guard :8009, tool executor :8003, judge :8004):
#
#   EVOGUARD_REPLAY_CONFIG=configs/agentdojo_latent_tsguard.yaml \
#   EVOGUARD_REPLAY_DATASET_DIR=data/agentdojo_latent \
#   EVOGUARD_REPLAY_SPLIT= scripts/run_replay_heldout.sh none adjlatent_tsguard 8
#
# `EVOGUARD_REPLAY_SPLIT=` (empty) is MANDATORY -- the probe declares no
# metadata["split"], so a task filter would match nothing.

name: evoguard_agentdojo_latent_tsguard

defense:
  agent: tsguard_guard
  llm:
    backend: openai
    model: qwen2.5-7b-it
    base_url: http://127.0.0.1:8000/v1
    api_key: EMPTY
    temperature: 0.2
    max_tokens: 1024
    timeout: 120.0
    max_retries: 3
  # The guardrail. Sampling matches ToolSafe's `Guardian` class verbatim
  # (temperature 0.1, top_p 0.9, max_tokens 2048) and decoding is UNCONSTRAINED:
  # the model is RL-trained to emit the four `<Tag> ... <\Tag>` blocks, and a
  # grammar would shift that distribution. `max_tokens` must stay large enough
  # for the `<Think>` analysis that precedes the judgements -- truncating it
  # loses the `<Harmfulness_Rating>` tag and the verdict fails OPEN.
  guard_llm:
    backend: openai
    model: ts-guard
    base_url: http://127.0.0.1:8009/v1
    api_key: EMPTY
    temperature: 0.1
    top_p: 0.9
    max_tokens: 2048
    timeout: 180.0
    max_retries: 3
    enable_thinking: false
  max_turns: 18

# Present because ExperimentConfig requires it; the probe replays authored
# observations and never invokes the attacker.
attacker:
  llm:
    backend: openai
    model: qwen2.5-7b-it
    base_url: http://127.0.0.1:8000/v1
    api_key: EMPTY
    temperature: 1.05
    top_p: 0.95
    max_tokens: 2048
    timeout: 180.0
    max_retries: 3
    lora_adapter: null
    enable_thinking: false
  search_method: mcts_delta
  population_size: 15
  offspring_size: 10
  elite_size: 3
  random_seed: 42

env:
  dataset: agentdojo_latent
  data_root: data
  suites: []
  max_tasks: 0
  tool_executor_llm:
    backend: openai
    model: qwen2.5-7b-it
    base_url: http://127.0.0.1:8003/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false
  judge_llm:
    backend: openai
    model: qwen3.5-9b
    base_url: http://127.0.0.1:8004/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 256
    enable_thinking: false
  utility_judge_llm:
    backend: openai
    model: qwen3.5-9b
    base_url: http://127.0.0.1:8004/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false

process:
  divergence_threshold: 0.5
  normalize_by: clean_length
  turning_point_method: llm_then_scan

training:
  enabled: false
  base_model: /root/paddlejob/workspace/yangxiao/models/Qwen2.5-7B-Instruct
  method: native_sft
  dry_run: true

pipeline:
  max_rounds: 1
  validation_fraction: 0.0
  task_concurrency: 8
  attack_concurrency: 8
  validate_every_round: false
  val_split: ""

evo_data_subdir: "agentdojo_latent"
