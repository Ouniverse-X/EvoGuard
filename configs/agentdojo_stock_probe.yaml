# EvoGuard probe: AgentDojo-Stock -- the Δ=0 CONTROL arm for AgentDojo-Latent.
#
# EVAL-ONLY. `training.enabled: false`, no split: 48 injections + 46 clean rows,
# all held-out diagnostic.
#
# Purpose. Read this config next to configs/agentdojo_latent_probe.yaml -- the
# two are one experiment. Every row here is its latent twin with ONLY the
# payload swapped for AgentDojo's own stock `ToolKnowledgeAttack`
# <INFORMATION> imperative: same 43 tasks, same clean plans, same
# carrier_tool/carrier_index, same benign_observation, same harmful_tool and
# harmful_args_hint, same attacker_goal. Camouflage is the single variable, so
# ASR(latent) − ASR(stock) is the effect of camouflage and of camouflage alone.
#
# Δ semantics. `expected_delta` is fixed at 1 on every row -- the smallest
# constructible plan-index offset from the carrier, i.e. the harmful call fires
# on the very next action. That is "Δ=0" in the MEASURED sense
# (signals.delta = turning − injection = 0), which is the quantity the latent
# arm is designed to raise. The twin's declared Δ ∈ {1,2,3} rides along as
# `twin_declared_delta`, so this arm can be stratified by the Δ its twin
# *would* have had. Join back onto replay records by (task_id, payload).
#
# How to run it (defender vLLM on :8000, tool executor :8003, judge :8004):
#
#   EVOGUARD_REPLAY_CONFIG=configs/agentdojo_stock_probe.yaml \
#   EVOGUARD_REPLAY_DATASET_DIR=data/agentdojo_stock \
#   EVOGUARD_REPLAY_SPLIT= scripts/run_replay_heldout.sh none adjstock_base
#
# `EVOGUARD_REPLAY_SPLIT=` (empty) is MANDATORY -- the probe declares no
# metadata["split"], so a task filter would match nothing.
#
# Everything below except `env.dataset`, `evo_data_subdir` and `name` is
# byte-identical to configs/agentdojo_latent_probe.yaml on purpose: a decoding
# or turn-budget difference between the arms would be indistinguishable from
# the camouflage effect. `max_turns: 18` is kept even though the stock sink
# fires on turn 1 -- shortening it here would give this arm less room to also
# finish the user's task, which is what UA measures.

name: evoguard_agentdojo_stock_probe

defense:
  llm:
    backend: openai
    model: qwen2.5-7b-it
    base_url: http://127.0.0.1:8000/v1
    api_key: EMPTY
    temperature: 0.2
    max_tokens: 1024
    timeout: 120.0
    max_retries: 3
  max_turns: 18

# Present because ExperimentConfig requires it; the probe replays authored
# observations and never invokes the attacker.
attacker:
  llm:
    backend: openai
    model: qwen2.5-7b-it
    base_url: http://127.0.0.1:8000/v1
    api_key: EMPTY
    temperature: 1.05
    top_p: 0.95
    max_tokens: 2048
    timeout: 180.0
    max_retries: 3
    lora_adapter: null
    enable_thinking: false
  search_method: mcts_delta
  population_size: 15
  offspring_size: 10
  elite_size: 3
  random_seed: 42

env:
  dataset: agentdojo_stock
  data_root: data
  # Empty = all four suites (banking, slack, travel, workspace).
  suites: []
  max_tasks: 0
  tool_executor_llm:
    backend: openai
    model: qwen2.5-7b-it
    base_url: http://127.0.0.1:8003/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false
  judge_llm:
    backend: openai
    model: qwen3.5-9b
    base_url: http://127.0.0.1:8004/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 256
    enable_thinking: false
  utility_judge_llm:
    backend: openai
    model: qwen3.5-9b
    base_url: http://127.0.0.1:8004/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false

process:
  divergence_threshold: 0.5
  normalize_by: clean_length
  turning_point_method: llm_then_scan

training:
  enabled: false
  base_model: /root/paddlejob/workspace/yangxiao/models/Qwen2.5-7B-Instruct
  method: native_sft
  dry_run: true

pipeline:
  max_rounds: 1
  validation_fraction: 0.0
  task_concurrency: 8
  attack_concurrency: 8
  validate_every_round: false
  val_split: ""

evo_data_subdir: "agentdojo_stock"
