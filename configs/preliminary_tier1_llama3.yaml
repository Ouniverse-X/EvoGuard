# EvoGuard preliminary Tier-1 experiment: LLaMA3-8B on :8001
# A stripped-down version of agentdojo_full_local.yaml that points all LLM
# endpoints at the LLaMA3-8B vLLM instance launched on port 8001.

name: preliminary_tier1_llama3

defense:
  llm:
    backend: openai
    model: llama3-8b
    base_url: http://127.0.0.1:8001/v1
    api_key: EMPTY
    temperature: 0.2
    max_tokens: 1024
    timeout: 120.0
    max_retries: 3
  max_turns: 8

attacker:
  llm:
    backend: openai
    model: llama3-8b
    base_url: http://127.0.0.1:8001/v1
    api_key: EMPTY
    temperature: 1.1
    max_tokens: 8192
    enable_thinking: false
    timeout: 180.0
  population_size: 12
  offspring_size: 10
  elite_size: 2
  tournament_k: 3
  crossover_rate: 0.9
  mutation_rate: 0.5
  diversity_penalty: 0.4
  diversity_position_window: 1
  crowding_factor: 2
  immigrant_injection_rate: 0.20
  fitness_drop_threshold: 0.50
  random_seed: 42

env:
  dataset: agentdojo
  data_root: data
  suites:
    - banking
    - slack
    - travel
    - workspace
  max_tasks: 100
  tool_executor_llm:
    backend: openai
    model: llama3-8b
    base_url: http://127.0.0.1:8001/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false
  judge_llm:
    backend: openai
    model: llama3-8b
    base_url: http://127.0.0.1:8001/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 256
    enable_thinking: false
  utility_judge_llm:
    backend: openai
    model: llama3-8b
    base_url: http://127.0.0.1:8001/v1
    api_key: EMPTY
    temperature: 0.0
    max_tokens: 512
    enable_thinking: false

process:
  divergence_threshold: 0.5
  normalize_by: clean_length

training:
  enabled: false
  base_model: /ssd1/models/llama3-8b
  method: native_sft
  dry_run: true

pipeline:
  max_rounds: 1
  patience_rounds: 5
  asr_threshold: 0.05
  stop_on_zero_success: false
  validation_fraction: 0.15
  task_concurrency: 4
  attack_concurrency: 4
